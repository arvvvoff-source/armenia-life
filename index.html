<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ARMENIA LIFE V1</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#101114;
  color:#f4f4f5;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

#app{
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:#17181c;
}

/* TOP */

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#1d1f24;
  border-bottom:1px solid #2d3037;
  padding:10px 12px;
}

.topRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.money{
  font-size:20px;
  font-weight:800;
}

.date{
  font-size:12px;
  color:#aaa;
}

.stat{
  min-width:75px;
}

.statTop{
  display:flex;
  justify-content:space-between;
  font-size:11px;
  color:#aaa;
}

.bar{
  height:6px;
  background:#303238;
  border-radius:10px;
  overflow:hidden;
  margin-top:3px;
}

.bar i{
  display:block;
  height:100%;
  width:50%;
  background:#55d66f;
}

/* MAIN */

.content{
  padding:12px 12px 80px;
}

/* CHARACTER */

.hero{
  background:linear-gradient(145deg,#22252b,#191b20);
  border:1px solid #30333a;
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
}

.heroTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.heroName{
  font-size:22px;
  font-weight:800;
}

.heroSub{
  color:#9fa3aa;
  font-size:13px;
  margin-top:3px;
}

.avatarBox{
  height:205px;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.avatar{
  position:relative;
  width:105px;
  height:175px;
}

.head{
  position:absolute;
  width:65px;
  height:65px;
  background:#d99a72;
  border-radius:50%;
  left:20px;
  top:4px;
  z-index:3;
  border:3px solid #a96f50;
}

.hair{
  position:absolute;
  width:70px;
  height:38px;
  background:#29201c;
  border-radius:40px 40px 15px 15px;
  left:17px;
  top:0;
  z-index:4;
}

.eye{
  position:absolute;
  width:5px;
  height:5px;
  border-radius:50%;
  background:#222;
  top:32px;
}

.e1{left:38px}
.e2{left:60px}

.body{
  position:absolute;
  width:82px;
  height:88px;
  background:#40516d;
  border-radius:20px 20px 8px 8px;
  left:11px;
  top:66px;
}

.arm{
  position:absolute;
  width:19px;
  height:70px;
  background:#d99a72;
  border-radius:15px;
  top:72px;
}

.a1{left:0;transform:rotate(7deg)}
.a2{right:0;transform:rotate(-7deg)}

.leg{
  position:absolute;
  width:28px;
  height:65px;
  background:#252832;
  top:140px;
  border-radius:8px;
}

.l1{left:22px}
.l2{right:22px}

.lifeInfo{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-top:8px;
}

.info{
  background:#202228;
  border-radius:10px;
  padding:9px 6px;
  text-align:center;
}

.info b{
  display:block;
  font-size:15px;
}

.info span{
  color:#969aa2;
  font-size:10px;
}

/* BUTTONS */

.sectionTitle{
  font-size:15px;
  font-weight:800;
  margin:16px 2px 8px;
}

.actions{
  display:grid;
  gap:7px;
}

.action{
  width:100%;
  background:#22242a;
  color:#fff;
  border:1px solid #30333a;
  border-radius:12px;
  padding:12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
}

.action:active{
  transform:scale(.98);
  background:#292c33;
}

.icon{
  width:39px;
  height:39px;
  border-radius:10px;
  background:#30333b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
  flex:none;
}

.actionMain{
  flex:1;
}

.actionMain b{
  display:block;
  font-size:14px;
}

.actionMain span{
  display:block;
  color:#92969e;
  font-size:11px;
  margin-top:2px;
}

.arrow{
  color:#777c85;
  font-size:20px;
}

/* MODAL */

.modalBg{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:flex-end;
  z-index:100;
}

.modalBg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:520px;
  margin:auto;
  background:#1b1d22;
  border-radius:20px 20px 0 0;
  max-height:88vh;
  overflow:auto;
  padding:18px;
}

.modalHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.modalHead b{
  font-size:19px;
}

.close{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#303239;
  color:#fff;
}

.option{
  background:#25272d;
  border:1px solid #34373f;
  border-radius:12px;
  padding:13px;
  margin:7px 0;
  color:white;
  width:100%;
  text-align:left;
}

.option b{
  display:block;
}

.option small{
  display:block;
  color:#999da5;
  margin-top:4px;
}

.option:active{
  background:#30333b;
}

.disabled{
  opacity:.4;
  pointer-events:none;
}

/* EVENT */

.event{
  background:#25272d;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  border:1px solid #373941;
}

.event b{
  font-size:16px;
}

.event p{
  color:#b1b4bb;
  font-size:13px;
  line-height:1.45;
}

/* TOAST */

#toast{
  position:fixed;
  left:50%;
  bottom:25px;
  transform:translateX(-50%) translateY(20px);
  background:#eee;
  color:#111;
  padding:10px 16px;
  border-radius:20px;
  font-size:13px;
  opacity:0;
  pointer-events:none;
  transition:.25s;
  z-index:200;
  white-space:nowrap;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* BOTTOM */

.bottom{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:100%;
  max-width:520px;
  background:#1b1d21;
  border-top:1px solid #303239;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:50;
}

.nav{
  background:none;
  color:#888d96;
  padding:9px 2px 8px;
  font-size:10px;
}

.nav b{
  display:block;
  font-size:19px;
  margin-bottom:2px;
}

.nav.active{
  color:#fff;
}

/* SMALL */

.green{color:#55d66f}
.red{color:#ff6565}
.yellow{color:#ffd15c}
.blue{color:#65aaff}

.empty{
  text-align:center;
  padding:25px 10px;
  color:#858990;
}

hr{
  border:0;
  border-top:1px solid #303239;
  margin:14px 0;
}
</style>
</head>

<body>

<div id="app">

  <header class="top">
    <div class="topRow">

      <div>
        <div class="money" id="money">0 ֏</div>
        <div class="date" id="date">2026 • Հունվար • 1</div>
      </div>

      <div class="stat">
        <div class="statTop">
          <span>❤️ Առողջ</span>
          <span id="healthText">70</span>
        </div>
        <div class="bar">
          <i id="healthBar"></i>
        </div>
      </div>

      <div class="stat">
        <div class="statTop">
          <span>😊 Երջ.</span>
          <span id="happyText">50</span>
        </div>
        <div class="bar">
          <i id="happyBar"></i>
        </div>
      </div>

    </div>
  </header>

  <main class="content">

    <section class="hero">

      <div class="heroTop">
        <div>
          <div class="heroName" id="playerName">Արման</div>
          <div class="heroSub" id="status">Գործազուրկ • Անօթևան</div>
        </div>

        <div class="yellow" id="age">18 տ.</div>
      </div>

      <div class="avatarBox">
        <div class="avatar">

          <div class="hair"></div>
          <div class="head">
            <div class="eye e1"></div>
            <div class="eye e2"></div>
          </div>

          <div class="arm a1"></div>
          <div class="arm a2"></div>

          <div class="body"></div>

          <div class="leg l1"></div>
          <div class="leg l2"></div>

        </div>
      </div>

      <div class="lifeInfo">

        <div class="info">
          <b id="jobInfo">Չկա</b>
          <span>Աշխատանք</span>
        </div>

        <div class="info">
          <b id="homeInfo">Փողոց</b>
          <span>Բնակարան</span>
        </div>

        <div class="info">
          <b id="familyInfo">Միայնակ</b>
          <span>Ընտանիք</span>
        </div>

      </div>

    </section>

    <div id="page"></div>

  </main>

</div>

<div class="bottom">

  <button class="nav active" onclick="go('life')">
    <b>👤</b>Կյանք
  </button>

  <button class="nav" onclick="go('work')">
    <b>💼</b>Աշխատանք
  </button>

  <button class="nav" onclick="go('home')">
    <b>🏠</b>Կենցաղ
  </button>

  <button class="nav" onclick="go('moneyPage')">
    <b>💰</b>Ֆինանսներ
  </button>

  <button class="nav" onclick="go('more')">
    <b>☰</b>Այլ
  </button>

</div>

<div class="modalBg" id="modalBg">

  <div class="modal">

    <div class="modalHead">
      <b id="modalTitle">Բաժին</b>
      <button class="close" onclick="closeModal()">✕</button>
    </div>

    <div id="modalContent"></div>

  </div>

</div>

<div id="toast"></div>

<script>

/* ======================================================
   TELEGRAM
====================================================== */

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* ======================================================
   GAME DATA
====================================================== */

const SAVE_KEY = "ARMENIA_LIFE_V1";

const JOBS = [

  {
    id:"worker",
    name:"Օրապահ բանվոր",
    salary:70000,
    education:0,
    desc:"Ծանր աշխատանք, բայց առաջին եկամուտը։"
  },

  {
    id:"courier",
    name:"Առաքիչ",
    salary:100000,
    education:0,
    desc:"Առաքումներ քաղաքում։"
  },

  {
    id:"seller",
    name:"Վաճառող",
    salary:130000,
    education:0,
    desc:"Աշխատանք խանութում։"
  },

  {
    id:"driver",
    name:"Վարորդ",
    salary:180000,
    education:1,
    desc:"Պահանջվում է վարորդական իրավունք։"
  },

  {
    id:"manager",
    name:"Մենեջեր",
    salary:280000,
    education:2,
    desc:"Կառավարման աշխատանք։"
  },

  {
    id:"developer",
    name:"Ծրագրավորող",
    salary:450000,
    education:3,
    desc:"Բարձր վարձատրվող մասնագիտություն։"
  },

  {
    id:"director",
    name:"Տնօրեն",
    salary:750000,
    education:4,
    desc:"Խոշոր ընկերության ղեկավար։"
  },

  {
    id:"ceo",
    name:"CEO",
    salary:1500000,
    education:5,
    desc:"Կորպորատիվ գագաթ։"
  }

];


const HOMES = [

  {
    id:"street",
    name:"Փողոց",
    price:0,
    comfort:0,
    desc:"Տուն չունես։"
  },

  {
    id:"dorm",
    name:"Հանրակացարան",
    price:30000,
    comfort:10,
    desc:"Փոքր, բայց տանիք ունես։"
  },

  {
    id:"room",
    name:"Վարձով սենյակ",
    price:100000,
    comfort:20,
    desc:"Ավելի նորմալ պայմաններ։"
  },

  {
    id:"apartment",
    name:"Բնակարան",
    price:5000000,
    comfort:45,
    desc:"Սեփական բնակարան։"
  },

  {
    id:"luxury",
    name:"Շքեղ բնակարան",
    price:18000000,
    comfort:70,
    desc:"Բարձրակարգ կյանք։"
  }

];


const CLOTHES = [

  {
    id:"poor",
    name:"Հին հագուստ",
    price:0,
    style:0
  },

  {
    id:"basic",
    name:"Սովորական հագուստ",
    price:50000,
    style:10
  },

  {
    id:"good",
    name:"Լավ հագուստ",
    price:180000,
    style:25
  },

  {
    id:"office",
    name:"Կոստյում",
    price:450000,
    style:45
  },

  {
    id:"luxury",
    name:"Թանկ հագուստ",
    price:1200000,
    style:70
  }

];


const CARS = [

  {
    id:"none",
    name:"Ոչ մի մեքենա",
    price:0,
    comfort:0
  },

  {
    id:"old",
    name:"Հին մեքենա",
    price:800000,
    comfort:15
  },

  {
    id:"normal",
    name:"Սովորական մեքենա",
    price:3500000,
    comfort:30
  },

  {
    id:"premium",
    name:"Պրեմիում մեքենա",
    price:12000000,
    comfort:55
  },

  {
    id:"super",
    name:"Սուպերմեքենա",
    price:45000000,
    comfort:80
  }

];


/* ======================================================
   INITIAL GAME
====================================================== */

function newGame(){

  return {

    version:1,

    name:"Արման",

    age:18,

    year:2026,
    month:1,
    day:1,

    money:0,

    health:70,
    happiness:50,
    hunger:40,

    education:0,

    job:null,

    home:"street",
    clothes:"poor",
    car:"none",

    partner:false,
    married:false,
    children:0,

    business:false,

    stocks:0,

    debt:0,

    reputation:0,

    experience:0,

    lastEvent:"",

    gameOver:false

  };

}


let G = loadGame();

function loadGame(){

  try{

    const saved = localStorage.getItem(SAVE_KEY);

    if(saved){

      return {
        ...newGame(),
        ...JSON.parse(saved)
      };

    }

  }catch(e){}

  return newGame();

}


function saveGame(){

  localStorage.setItem(
    SAVE_KEY,
    JSON.stringify(G)
  );

}


/* ======================================================
   HELPERS
====================================================== */

function money(n){

  return Math.round(n).toLocaleString("hy-AM")+" ֏";

}


function getJob(){

  return JOBS.find(x=>x.id===G.job);

}


function getHome(){

  return HOMES.find(x=>x.id===G.home);

}


function getClothes(){

  return CLOTHES.find(x=>x.id===G.clothes);

}


function getCar(){

  return CARS.find(x=>x.id===G.car);

}


function toast(text){

  const el=document.getElementById("toast");

  el.textContent=text;

  el.classList.add("show");

  setTimeout(()=>{
    el.classList.remove("show");
  },1800);

}


function clamp(n,min,max){

  return Math.max(min,Math.min(max,n));

}


/* ======================================================
   DATE
====================================================== */

const MONTHS=[
  "Հունվար",
  "Փետրվար",
  "Մարտ",
  "Ապրիլ",
  "Մայիս",
  "Հունիս",
  "Հուլիս",
  "Օգոստոս",
  "Սեպտեմբեր",
  "Հոկտեմբեր",
  "Նոյեմբեր",
  "Դեկտեմբեր"
];


function nextDay(){

  if(G.gameOver) return;

  G.day++;

  if(G.day>30){

    G.day=1;
    G.month++;

  }

  if(G.month>12){

    G.month=1;
    G.year++;
    G.age++;

    yearlyEvent();

  }

  dailyUpdate();

  randomEvent();

  checkDeath();

  saveGame();

  render();

}


function dailyUpdate(){

  G.hunger += 5;

  G.health -= 1;

  G.happiness -= 1;

  const home=getHome();

  G.happiness += Math.floor(home.comfort/25);

  if(G.hunger>80){

    G.health-=2;

  }

  if(G.hunger>95){

    G.health-=4;

  }

  if(G.job){

    const job=getJob();

    if(G.day===1){

      G.money += job.salary;

      toast("💼 Աշխատավարձ ստացար՝ "+money(job.salary));

    }

  }

  if(G.business && G.day===1){

    const income=150000 + Math.floor(Math.random()*250000);

    G.money+=income;

  }

  if(G.debt>0 && G.day===1){

    const interest=Math.ceil(G.debt*0.015);

    G.debt+=interest;

  }

  G.health=clamp(G.health,0,100);
  G.happiness=clamp(G.happiness,0,100);
  G.hunger=clamp(G.hunger,0,100);

}


function yearlyEvent(){

  G.health-=2;

  if(G.age>=65){

    G.health-=5;

  }

}


/* ======================================================
   RANDOM EVENTS
====================================================== */

function randomEvent(){

  if(Math.random()>0.14) return;

  const events=[

    {
      title:"💸 Անսպասելի ծախս",
      text:"Հեռախոսդ փչացավ։ Վերանորոգումը գումար արժեցավ։",
      effect:()=>{
        G.money=Math.max(0,G.money-25000);
      }
    },

    {
      title:"🎁 Հաջողություն",
      text:"Ծանոթդ քեզ փոքր գումար տվեց։",
      effect:()=>{
        G.money+=30000;
      }
    },

    {
      title:"🤒 Հիվանդություն",
      text:"Մի քանի օր վատ ինքնազգացողություն ունեցար։",
      effect:()=>{
        G.health-=10;
        G.money=Math.max(0,G.money-15000);
      }
    },

    {
      title:"😊 Լավ օր",
      text:"Հաճելի հանդիպում ունեցար։",
      effect:()=>{
        G.happiness+=10;
      }
    },

    {
      title:"💼 Աշխատանքի առաջարկ",
      text:"Քո փորձը նկատեցին։",
      effect:()=>{
        G.experience+=2;
        G.reputation+=1;
      }
    }

  ];

  const e=events[Math.floor(Math.random()*events.length)];

  e.effect();

  G.lastEvent=e.title+" — "+e.text;

}


/* ======================================================
   DEATH
====================================================== */

function checkDeath(){

  if(G.age>=80 || G.health<=0){

    G.gameOver=true;

    openModal(
      "Կյանքի ավարտ",
      `
        <div class="event">
          <b>🕯️ Խաղն ավարտվեց</b>
          <p>

/* ======================================================
   NAVIGATION
====================================================== */

let currentPage="life";


function go(page){

  currentPage=page;

  document.querySelectorAll(".nav").forEach(x=>{
    x.classList.remove("active");
  });

  const index={
    life:0,
    work:1,
    home:2,
    moneyPage:3,
    more:4
  }[page];

  document.querySelectorAll(".nav")[index]?.classList.add("active");

  renderPage();

}


function renderPage(){

  const p=document.getElementById("page");

  if(currentPage==="life") p.innerHTML=lifePage();
  if(currentPage==="work") p.innerHTML=workPage();
  if(currentPage==="home") p.innerHTML=homePage();
  if(currentPage==="moneyPage") p.innerHTML=moneyPage();
  if(currentPage==="more") p.innerHTML=morePage();

}

    return;

  G.job=id;

  G.experience++;

  saveGame();

  toast("💼 Նոր աշխատանք՝ "+j.name);

  render();

            ?"Անվճար"
            :money(c.price)
          }
          • Հարմարավետություն +${c.comfort}
        </small>

      </button>

    `).join("")
  );

}


function buyCar(id){

  const c=CARS.find(x=>x.id===id);

  if(c.price>G.money){

    toast("❌ Գումարը չի բավականացնում");

    return;

  }

  G.money-=c.price;

  G.car=id;

  G.happiness+=Math.floor(c.comfort/5);

  saveGame();

  closeModal();

  toast("🚗 Նոր մեքենա");

  render();

}

function bank(){

    `

        <p>
          Վարկ վերցնելը արագացնում է առաջընթացը,
          բայց ամեն ամիս ավելանում են տոկոսները։
        </p>

      </div>

      <button class="option" onclick="loan(100000)">

        💳 Վերցնել 100,000 ֏

      </button>

      <button class="option" onclick="loan(500000)">

        💳 Վերցնել 500,000 ֏

      </button>

      <button class="option" onclick="loan(1000000)">

        💳 Վերցնել 1,000,000 ֏

      </button>

      <button class="option" onclick="repay()">

        💸 Մարել պարտքը

        <small>
          Մատչելի գումարի չափով
        </small>

      </button>

    `
  );

}


function loan(amount){

  G.money+=amount;

  G.debt+=amount;

  saveGame();

  closeModal();

  toast("💳 Վարկ ստացար՝ "+money(amount));

  render();

}


function repay(){

  if(G.debt<=0){

    toast("Պարտք չունես");

    return;

  }

  const amount=Math.min(G.money,G.debt);

  if(amount<=0){

    toast("Գումար չունես");

    return;

  }

  G.money-=amount;

  G.debt-=amount;

  saveGame();

  closeModal();

  toast("💸 Մարեցիր "+money(amount));

  render();

}


/* ======================================================
   STOCK MARKET
====================================================== */

function stocks(){

  const price=10000+Math.floor(Math.random()*10000);

  openModal(
    "📈 Բորսա",

    `

      <div class="event">

        <b>ARM Index</b>

        <p>
          Ընթացիկ գին՝ <span class="green">${money(price)}</span>
          <br>
          Քո բաժնետոմսերը՝ ${G.stocks}
        </p>

      </div>

      <button class="option" onclick="buyStock(${price})">
        📈 Գնել 1 բաժնետոմս
      </button>

      <button class="option" onclick="sellStock(${price})">
        📉 Վաճառել 1 բաժնետոմս
      </button>

    `
  );

}


function buyStock(price){

  if(G.money<price){

    toast("❌ Գումար չկա");

    return;

  }

  G.money-=price;

  G.stocks++;

  saveGame();

  closeModal();

  toast("📈 Բաժնետոմս գնվեց");

  render();

}


function sellStock(price){

  if(G.stocks<=0){

    toast("Բաժնետոմս չունես");

    return;

  }

  G.stocks--;

  G.money+=price;

  saveGame();

  closeModal();

  toast("📉 Բաժնետոմս վաճառվեց");

  render();

}

function gamble(amount){

  if(G.money<amount){

    toast("❌ Գումար չունես");

    return;

  }

  G.money-=amount;

  if(Math.random()<0.45){

    G.money+=amount*2;

    toast("🎉 Հաղթեցիր!");

  }else{

    toast("💀 Պարտվեցիր");

  }

  saveGame();

  closeModal();

  render();

}

function politicalStep(required,name){

  G.reputation+=3;

  G.happiness+=5;

  closeModal();

  toast("🏛️ Դարձար "+name);

  render();

}


function president(){

/* ======================================================
   MODAL
====================================================== */

function openModal(title,html){

  document.getElementById("modalTitle").textContent=title;

  document.getElementById("modalContent").innerHTML=html;

  document.getElementById("modalBg").classList.add("show");

}


function closeModal(){

  document.getElementById("modalBg").classList.remove("show");

}
